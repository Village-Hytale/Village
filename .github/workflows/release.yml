name: Release

# Triggered only by pushing a version tag (e.g. v1.1.0), which is always a deliberate, manual action.
on:
  push:
    tags: [ "v*" ]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check the tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION=$(grep -E '^version[[:space:]]*=' gradle.properties | sed -E 's/^version[[:space:]]*=[[:space:]]*//' | tr -d '\r ')

          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Tag $TAG does not match the project version $VERSION (gradle.properties). Expected tag v$VERSION."
            exit 1
          fi

          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $TAG must point to a commit on main."
            exit 1
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Extract release notes from CHANGELOG.md
        run: |
          # Lines between "## [<version>]" and the next "## [" heading
          awk -v header="## [$VERSION]" '
            index($0, header) == 1       { found = 1; next }
            found && index($0, "## [") == 1 { exit }
            found                        { print }
          ' CHANGELOG.md > release-notes.md

          if [ -z "$(tr -d '[:space:]' < release-notes.md)" ]; then
            echo "::error::No section [$VERSION] found in CHANGELOG.md."
            exit 1
          fi

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build all modules
        run: ./gradlew build

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" village-*/build/libs/*.jar \
            --title "Village $GITHUB_REF_NAME" \
            --notes-file release-notes.md
