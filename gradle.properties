# Gradle runtime options
org.gradle.daemon = true
org.gradle.jvmargs = -Xmx3G
org.gradle.parallel = true
org.gradle.caching = true

# ---------------------------------------------------------------
# Values shared by every module (village-core, village-roles).
# Module-specific values live in <module>/build.gradle.kts.
#
# Machine-specific values (e.g. hytaleHomeOverride, the path to your
# local Assets.zip) belong in ~/.gradle/gradle.properties, not here.
# ---------------------------------------------------------------

# Version shared by every Village jar
version = 1.0.0

# Java / Hytale
java_version = 25
hytale_version = 0.6.8
patchline = release
manifestServerVersion = >=0.6.8 <0.7.0

# Identity
group = dev.gevail
manifest_group = Gevail
mod_author = Gevail
mod_url = https://github.com/Village-Hytale/Village

# Tooling
injectServerJavadocsIntoSources = true
generateAssetsBinary = false
